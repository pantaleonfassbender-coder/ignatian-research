name: check-corpus
# Runs the apparatus consistency check (tools/check-ignatiana.py) on every
# push and pull request: registry and programme, open-edition unit counts,
# reading-path anchors, nav/route agreement, documentation presence.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apparatus consistency check
        run: python tools/check-ignatiana.py
